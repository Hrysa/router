[package]
name = "routerd"
version = "0.1.0"
edition = "2021"
description = "Linux router daemon — API-centric network management"
license = "MIT"

[[bin]]
name = "routerd"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Auth
jsonwebtoken = "9"
bcrypt = "0.15"

# System
nix = { version = "0.28", features = ["user", "signal"] }
which = "7"

# File embedding (SPA assets)
rust-embed = "8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# UUID (for backups, request IDs)
uuid = { version = "1", features = ["v4"] }

# Regex (validation)
regex = "1"

# Hostname
gethostname = "0.5"

# nftables JSON API
nftables = { version = "0.6.3", features = ["tokio"] }

# MIME types for SPA serving
mime_guess = "2"
metrics = "0.24.6"
metrics-util = "0.20.4"

[dev-dependencies]
axum-test = "16"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
